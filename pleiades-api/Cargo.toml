[package]
name = "pleiades-api"
version = "0.1.0"
edition = "2021"
authors = ["jme"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2.0"
bytes = {workspace = true}
typed-builder = "0.18"
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true}
tracing-subscriber = {workspace = true}
