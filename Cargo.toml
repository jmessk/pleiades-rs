[package]
name = "pleiades"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
url = "2.0"
bytes = "1.0"
log = "0.4"
typed-builder = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
